plugins {
    id 'com.android.application'
}

android {
    namespace 'ro.auracamera.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ro.auracamera.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
